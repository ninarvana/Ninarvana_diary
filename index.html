<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Station Nina — voyage Amérique du Sud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,500;0,9..144,600;1,9..144,420&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --paper: #EEE8DA;
    --paper-deep: #E4DCC8;
    --ink: #2C2620;
    --ink-soft: #6E6552;
    --ink-faint: #9A9080;
    --clay: #A15C3C;
    --line: #D2C7AE;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
    font-family: 'Fraunces', Georgia, serif; -webkit-font-smoothing: antialiased;
  }

  /* Bandeau compact — laisse le maximum de place à la carte */
  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: #46493A; color: #EFE9D8;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  header.top .title { font-weight: 600; font-size: 0.86rem; letter-spacing: 0.1em; text-transform: uppercase; }
  header.top .title span { display: block; font-weight: 380; font-style: italic; font-size: 0.68rem; letter-spacing: 0; color: #C9C0A6; text-transform: none; margin-top: 1px; }

  nav.tabs { display: flex; }
  nav.tabs button {
    background: none; border: none;
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 0.68rem;
    letter-spacing: 0.08em; text-transform: uppercase; color: #C9C0A6;
    padding: 6px 10px; cursor: pointer; border-bottom: 2px solid transparent;
  }
  nav.tabs button.active { color: #EFE9D8; border-bottom-color: var(--clay); }

  .panel { display: none; }
  .panel.active { display: block; }

  /* ===== CARTE — plein écran ===== */
  #carte.panel.active { display: flex; flex-direction: column; }
  .map-wrap { flex: 1; width: 100%; min-height: calc(100vh - 52px); }
  .map-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

  /* ===== PORTFOLIO ===== */
  .portfolio-frame { margin: 18px; border: 1px solid var(--line); background: var(--paper-deep); }
  .portfolio-embed { position: relative; padding-bottom: 62%; height: 0; overflow: hidden; }
  .portfolio-embed iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  .portfolio-caption {
    padding: 12px 16px 14px; font-style: italic; font-size: 0.82rem;
    color: var(--ink-soft); text-align: center; border-top: 1px solid var(--line);
  }
  .portfolio-more { text-align: center; padding: 18px 20px 40px; }
  .portfolio-more .open-btn {
    display: inline-block; padding: 12px 28px; border: 1px solid var(--clay);
    color: var(--clay); text-decoration: none; font-family: 'Fraunces', serif;
    font-weight: 500; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase;
  }

  footer.contact { text-align: center; padding: 16px 20px 30px; font-style: italic; font-size: 0.82rem; color: var(--ink-soft); }
  footer.contact a { color: var(--clay); text-decoration: none; border-bottom: 1px solid var(--clay); }

  @media (prefers-color-scheme: dark) {
    body:not([data-theme="light"]) {
      --paper: #211D17; --paper-deep: #2A251D; --ink: #EDE7D8;
      --ink-soft: #B9AF98; --ink-faint: #857C68; --line: #3C362A;
    }
  }
</style>
</head>
<body>

<header class="top">
  <div class="title">Station Nina<span>Chili · Argentine · Panama</span></div>
  <nav class="tabs">
    <button class="active" data-target="carte">Carte</button>
    <button data-target="portfolio">Portfolio</button>
  </nav>
</header>

<section class="panel active" id="carte">
  <div class="map-wrap">
    <iframe src="https://ninarvana.travelmap.net" allow="fullscreen" title="Carte du voyage de Nina"></iframe>
  </div>
</section>

<section class="panel" id="portfolio">
  <div class="portfolio-frame">
    <div class="portfolio-embed">
      <iframe src="https://lightroom.adobe.com/embed/shares/e3430cac3a744459892c4b79e24c6f7e/slideshow?background_color=%23EEE8DA&color=%236E6552" title="Album photo de Nina"></iframe>
    </div>
    <p class="portfolio-caption">Les dernières photos du voyage</p>
  </div>
  <div class="portfolio-more">
    <a class="open-btn" href="https://lightroom.adobe.com/shares/e3430cac3a744459892c4b79e24c6f7e" target="_blank" rel="noopener">Voir toutes les photos</a>
  </div>
</section>

<footer class="contact">
  Pour me joindre directement, <a href="https://wa.me/33000000000" target="_blank" rel="noopener">WhatsApp reste le plus sûr</a>.
</footer>

<script>
  document.querySelectorAll('nav.tabs button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.target).classList.add('active');
    });
  });
</script>

</body>
</html>
