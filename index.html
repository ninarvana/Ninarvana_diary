<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Following the Violacrumbs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,500;0,9..144,600;1,9..144,420&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --paper: #EEE8DA;
    --paper-deep: #E4DCC8;
    --ink: #2C2620;
    --ink-soft: #6E6552;
    --ink-faint: #9A9080;
    --clay: #A15C3C;
    --line: #D2C7AE;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
    font-family: 'Fraunces', Georgia, serif; -webkit-font-smoothing: antialiased;
  }
 
  /* Bandeau compact — laisse le maximum de place à la carte */
  /* Bandeau — fixe, hauteur mesurée en JS */
  header.top {
    position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    flex-wrap: wrap;
    padding: 14px 16px; background: #46493A; color: #EFE9D8;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  header.top .brand { display: flex; align-items: center; gap: 12px; }
  header.top .logo-slot {
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px dashed rgba(255,255,255,0.35);
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
  }
  header.top .logo-slot svg { width: 22px; height: 22px; opacity: 0.55; }
  header.top .title { font-weight: 600; font-size: 0.92rem; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.3; }
  header.top .title span { display: block; font-weight: 380; font-style: italic; font-size: 0.68rem; letter-spacing: 0; color: #C9C0A6; text-transform: none; margin-top: 2px; }
  header.top .right { display: flex; align-items: center; gap: 16px; margin-left: auto; }
  header.top .clock {
    display: flex; align-items: center; gap: 6px;
    font-family: 'Fraunces', serif; font-size: 0.7rem; color: #C9C0A6;
  }
  header.top .clock svg { width: 13px; height: 13px; opacity: 0.7; }
  header.top .clock b { color: #EFE9D8; font-weight: 500; }
 
  nav.tabs { display: flex; }
  nav.tabs button {
    background: none; border: none;
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 0.68rem;
    letter-spacing: 0.08em; text-transform: uppercase; color: #C9C0A6;
    padding: 6px 10px; cursor: pointer; border-bottom: 2px solid transparent;
  }
  nav.tabs button.active { color: #EFE9D8; border-bottom-color: var(--clay); }
 
  .panel { display: none; }
  .panel.active { display: block; }
 
  /* ===== CARTE — occupe tout l'espace sous le bandeau, hauteur fixée en JS ===== */
  #carte.panel {
    position: fixed;
    top: var(--header-h, 72px);
    left: 0; right: 0; bottom: 0;
  }
  #carte.panel.active { display: block; }
  .map-wrap, .map-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
 
  /* ===== PORTFOLIO — flux normal, décalé sous le bandeau fixe ===== */
  #portfolio.panel { padding-top: var(--header-h, 56px); }
 
  /* ===== PORTFOLIO ===== */
  .portfolio-frame { margin: 18px; border: 1px solid var(--line); background: var(--paper-deep); }
  .portfolio-embed { position: relative; padding-bottom: 62%; height: 0; overflow: hidden; }
  .portfolio-embed iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  .portfolio-caption {
    padding: 12px 16px 14px; font-style: italic; font-size: 0.82rem;
    color: var(--ink-soft); text-align: center; border-top: 1px solid var(--line);
  }
  .portfolio-more { text-align: center; padding: 18px 20px 40px; }
  .portfolio-more .open-btn {
    display: inline-block; padding: 12px 28px; border: 1px solid var(--clay);
    color: var(--clay); text-decoration: none; font-family: 'Fraunces', serif;
    font-weight: 500; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase;
  }
 
  footer.contact { text-align: center; padding: 16px 20px 30px; font-style: italic; font-size: 0.82rem; color: var(--ink-soft); }
  footer.contact a { color: var(--clay); text-decoration: none; border-bottom: 1px solid var(--clay); }
 
  @media (prefers-color-scheme: dark) {
    body:not([data-theme="light"]) {
      --paper: #211D17; --paper-deep: #2A251D; --ink: #EDE7D8;
      --ink-soft: #B9AF98; --ink-faint: #857C68; --line: #3C362A;
    }
  }
</style>
</head>
<body>
 
<header class="top">
  <div class="brand">
    <div class="logo-slot">
      <!-- Remplacer par <img src="..." alt=""> une fois le dessin synthétisé prêt -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4" stroke="#EFE9D8" stroke-width="1"/></svg>
    </div>
    <div class="title">Following the Violacrumbs<span>Chili · Argentina</span></div>
  </div>
  <div class="right">
    <div class="clock" id="barilocheClock">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="#C9C0A6" stroke-width="1.2"/><path d="M12 7v5l3 2" stroke="#C9C0A6" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span><b id="barilocheTime">--:--</b> Nina's Time</span>
    </div>
    <nav class="tabs">
      <button class="active" data-target="carte">Map</button>
      <button data-target="portfolio">Portfolio</button>
    </nav>
  </div>
</header>
 
<section class="panel active" id="carte">
  <div class="map-wrap">
    <iframe src="https://ninarvana.travelmap.net" allow="fullscreen" title="Carte du voyage de Nina"></iframe>
  </div>
</section>
 
<section class="panel" id="portfolio">
  <div class="portfolio-frame">
    <div class="portfolio-embed">
      <iframe src="https://lightroom.adobe.com/embed/shares/e3430cac3a744459892c4b79e24c6f7e/slideshow?background_color=%23EEE8DA&color=%236E6552" title="Album photo de Nina"></iframe>
    </div>
    <p class="portfolio-caption">Latest on the roll</p>
  </div>
  <div class="portfolio-more">
    <a class="open-btn" href="https://lightroom.adobe.com/shares/e3430cac3a744459892c4b79e24c6f7e" target="_blank" rel="noopener">See all the photos</a>
  </div>
</section>
 
<footer class="contact">
  Stay in touch with <a href="https://wa.me/33000000000" target="_blank" rel="noopener">WhatsApp</a> :)
</footer>
 
<script>
  document.querySelectorAll('nav.tabs button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.target).classList.add('active');
    });
  });
 
  function updateBarilocheClock(){
    const el = document.getElementById('barilocheTime');
    if (!el) return;
    const formatter = new Intl.DateTimeFormat('fr-FR', {
      hour: '2-digit', minute: '2-digit',
      timeZone: 'America/Argentina/Buenos_Aires'
    });
    el.textContent = formatter.format(new Date());
  }
  updateBarilocheClock();
  setInterval(updateBarilocheClock, 30000);
 
  function setHeaderHeight(){
    const h = document.querySelector('header.top').offsetHeight;
    document.documentElement.style.setProperty('--header-h', h + 'px');
  }
  setHeaderHeight();
  window.addEventListener('resize', setHeaderHeight);
  window.addEventListener('orientationchange', setHeaderHeight);
</script>
 
</body>
</html>
